<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun-Gu Lee | Radiometric Calibration · SAR · Satellite Applications</title>
<meta name="description" content="Principal Researcher at KARI, Associate Professor at UST KARI School. Radiometric calibration of the KOMPSAT series, SAR applications, and multi-sensor convergence for Earth observation.">
<meta name="author" content="Sun-Gu Lee">
<meta name="theme-color" content="#071428">
<meta property="og:type" content="profile">
<meta property="og:title" content="Sun-Gu Lee | Radiometric Calibration · SAR · Satellite Applications">
<meta property="og:description" content="Principal Researcher, KARI · Associate Professor, UST KARI School">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b2545'/><circle cx='50' cy='50' r='22' fill='none' stroke='%233fb3c9' stroke-width='6'/><circle cx='50' cy='50' r='7' fill='%23e8f4f8'/></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<a class="skip" href="#main">본문 바로가기</a>

<header class="topbar" id="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="4.2"/><ellipse cx="12" cy="12" rx="10.4" ry="4.6" transform="rotate(-28 12 12)"/>
        </svg>
      </span>
      <span class="brand-text" data-bind="brand"></span>
    </a>
    <nav class="nav" id="nav" aria-label="주 메뉴"></nav>
    <div class="topbar-actions">
      <button class="lang-btn" id="langBtn" type="button" aria-label="Change language"></button>
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav" aria-label="메뉴">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ============ HERO (dark) ============ -->
  <section class="hero" id="home">
    <canvas class="hero-canvas" id="heroCanvas" aria-hidden="true"></canvas>
    <div class="wrap hero-inner">
      <div class="hero-text">
        <p class="eyebrow" data-bind="hero.eyebrow"></p>
        <h1 class="hero-name" data-bind="hero.name"></h1>
        <p class="hero-namesub" data-bind="hero.nameSub"></p>
        <ul class="hero-roles" id="heroRoles"></ul>
        <p class="hero-tagline" data-bind="hero.tagline"></p>
        <div class="hero-cta" id="heroCta"></div>
      </div>
      <!-- KOMPSAT-3 관측·처리 파이프라인 콘솔 (개념 시연) -->
      <aside class="console" id="console" aria-label="KOMPSAT-3 observation console"></aside>
    </div>

    <!-- 최신 연구동향: 첫 화면에 노출, GitHub Actions 가 매일 갱신 -->
    <div class="wrap">
      <section class="trends" id="trends" aria-labelledby="trendsTitle">
        <div class="trends-head">
          <span class="live" aria-hidden="true"><i></i><b data-bind="trends.liveLabel"></b></span>
          <h2 id="trendsTitle" data-bind="trends.heading"></h2>
          <span class="trends-sub" data-bind="trends.sub"></span>
          <span class="trends-updated" id="trendsUpdated"></span>
        </div>
        <div class="trends-viewport" id="trendsViewport">
          <div class="trends-track" id="trendsTrack"></div>
        </div>
      </section>
    </div>

    <div class="wrap">
      <ul class="stats" id="heroStats"></ul>
    </div>
  </section>

  <!-- ============ LIVE TRACKING ============ -->
  <section class="section alt" id="tracking">
    <div class="wrap">
      <h2 class="sec-title" data-bind="tracking.heading"></h2>
      <p class="sec-lead" data-bind="tracking.lead"></p>

      <div class="track-head">
        <span class="live" aria-hidden="true"><i></i><b data-bind="tracking.liveLabel"></b></span>
        <span class="track-clock" id="trackClock"></span>
        <span class="track-updated" id="trackUpdated"></span>
      </div>

      <figure class="track-map">
        <canvas id="trackMap" role="img" aria-label="KOMPSAT satellite ground positions"></canvas>
        <p class="track-banner" id="trackEmpty" hidden></p>
      </figure>

      <div id="trackWrap" hidden>
        <div class="track-scroll">
          <table class="track-table">
            <thead><tr id="trackHead"></tr></thead>
            <tbody id="trackBody"></tbody>
          </table>
        </div>
      </div>

      <p class="track-note" data-bind="tracking.note"></p>
    </div>
  </section>

  <!-- ============ ABOUT ============ -->
  <section class="section" id="about">
    <div class="wrap">
      <h2 class="sec-title" data-bind="about.heading"></h2>
      <p class="sec-lead" data-bind="about.lead"></p>
      <div class="about-grid">
        <div class="about-body" id="aboutBody"></div>
        <aside class="about-side">
          <div class="side-block" id="careerBlock"></div>
          <div class="side-block" id="educationBlock"></div>
          <div class="side-block" id="awardsBlock"></div>
          <div class="side-block" id="societyBlock"></div>
        </aside>
      </div>
    </div>
  </section>

  <!-- ============ RESEARCH ============ -->
  <section class="section alt" id="research">
    <div class="wrap">
      <h2 class="sec-title" data-bind="research.heading"></h2>
      <p class="sec-lead" data-bind="research.lead"></p>
      <div class="card-grid" id="researchAreas"></div>
      <div id="simCta"></div>
      <h3 class="sub-title" data-bind="research.projectHeading"></h3>
      <div class="project-list" id="projectList"></div>
    </div>
  </section>

  <!-- ============ MEDIA ============ -->
  <section class="section" id="media">
    <div class="wrap">
      <h2 class="sec-title" data-bind="media.heading"></h2>
      <p class="sec-lead" data-bind="media.lead"></p>
      <h3 class="sub-title" data-bind="media.videoHeading"></h3>
      <div class="video-grid" id="videoGrid"></div>
      <h3 class="sub-title" id="galleryHead" data-bind="media.galleryHeading"></h3>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <!-- ============ PUBLICATIONS ============ -->
  <section class="section alt" id="publications">
    <div class="wrap">
      <h2 class="sec-title" data-bind="publications.heading"></h2>
      <p class="sec-lead" data-bind="publications.lead"></p>
      <h3 class="sub-title" data-bind="publications.highlightsHeading"></h3>
      <div class="hl-grid" id="highlights"></div>
      <div class="tabs" id="pubTabs" role="tablist"></div>
      <div class="pub-panel" id="pubPanel"></div>
    </div>
  </section>

  <!-- ============ TEACHING ============ -->
  <section class="section" id="teaching">
    <div class="wrap">
      <h2 class="sec-title" data-bind="teaching.heading"></h2>
      <p class="sec-lead" data-bind="teaching.lead"></p>

      <div class="teach-top">
        <div class="appt">
          <h3 class="sub-title tight" data-bind="teaching.appointment.heading"></h3>
          <dl class="appt-list" id="apptList"></dl>
        </div>
        <div class="offer">
          <h3 class="sub-title tight" data-bind="teaching.offerHeading"></h3>
          <ul class="check-list" id="offerList"></ul>
        </div>
      </div>

      <h3 class="sub-title" data-bind="teaching.topicsHeading"></h3>
      <div class="topic-grid" id="topicGrid"></div>

      <div class="recruit">
        <h3 data-bind="teaching.recruitHeading"></h3>
        <p data-bind="teaching.recruitBody"></p>
        <a class="btn" id="recruitBtn" href="#contact"></a>
      </div>
    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="section alt" id="contact">
    <div class="wrap">
      <h2 class="sec-title" data-bind="contact.heading"></h2>
      <p class="sec-lead" data-bind="contact.lead"></p>
      <div class="contact-grid">
        <dl class="contact-list" id="contactList"></dl>
        <div>
          <h3 class="sub-title tight" data-bind="contact.linksHeading"></h3>
          <ul class="link-list" id="linkList"></ul>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ============ FAMILY SITE ============ -->
<section class="family" aria-labelledby="familyHead">
  <div class="wrap family-inner">
    <h2 class="family-head" id="familyHead" data-bind="family.heading"></h2>
    <div class="family-list" id="familyList"></div>
  </div>
</section>

<footer class="footer">
  <div class="wrap footer-inner">
    <p data-bind="footer.copy"></p>
    <p class="muted" data-bind="footer.note"></p>
  </div>
</footer>

<a class="to-top" id="toTop" href="#home" aria-label="맨 위로">↑</a>

<!-- 이미지 확대 보기 -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
  <button class="lb-close" id="lbClose" type="button" aria-label="닫기">×</button>
  <figure>
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<script src="assets/js/content.js"></script>
<script src="assets/js/worldmap.js"></script>
<script src="assets/js/coast-ea.js"></script>
<script src="assets/js/orbit.js"></script>
<script src="assets/js/tracker.js"></script>
<script src="assets/js/diagrams.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/hero.js" defer></script>
</body>
</html>
